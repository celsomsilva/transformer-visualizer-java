plugins {
    id 'java'
    id 'application'
}

group = 'com.celso.swingtransformer'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.celso.swingtransformer.App'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName.set("swing-transformer")
    archiveVersion.set("")   // remove version
    manifest {
        attributes(
            'Main-Class': 'com.celso.swingtransformer.App'
        )
    }
}

